# Prometheus scrape config (ARCHITECTURE §13). Metrics endpoints are implemented in M4.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: worker # every replica, discovered through Docker DNS
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100

  - job_name: rabbitmq # queue depth via the rabbitmq_prometheus plugin
    static_configs:
      - targets: ["rabbitmq:15692"]
